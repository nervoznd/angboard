<div
  class="dashboard-grid"
  cdkDropList
  cdkDropListOrientation="mixed"
  (cdkDropListDropped)="onDrop($event)"
>
  @for (widget of state.widgets(); track widget.id) {
    <div
      class="widget-card"
      cdkDrag
      [style.grid-column]="'span ' + widget.size.cols"
      [style.grid-row]="'span ' + widget.size.rows"
    >
      <div class="widget-header" cdkDragHandle>
        <h3>{{ widget.title }}</h3>
        <span class="drag-hint" aria-hidden="true">⠿</span>
      </div>
      <ng-container appWidgetHost [widget]="widget"></ng-container>
    </div>
  }
</div>
